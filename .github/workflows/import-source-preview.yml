name: Import verified VYRNEXIS source

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: vyrnexis-source-import
  cancel-in-progress: false

jobs:
  import-source:
    if: github.repository == 'ArtifactShruti/vyrnexis-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Commit the verified source snapshot
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/vyrnexis-ai-source.zip"
          target="$RUNNER_TEMP/vyrnexis-source"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' \
            --output "$archive" 'https://github.com/ArtifactShruti/vyrnexis-ai/releases/download/v0.1.0-source-preview/vyrnexis-ai-source.zip'
          printf '%s  %s\n' b63139fe6743ec398fe3875c391848b43a8baf4eeff919988a6345bab2903139 "$archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$target"
          test -f "$target/vyrnexis-ai/apps/web/src/components/DashboardActivity.tsx"
          rsync -a --exclude='/.github/workflows/' "$target/vyrnexis-ai/" ./
          git rm --ignore-unmatch -- vyrnexis-cover.png
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Publish verified VYRNEXIS AI application source'
          git push origin HEAD:refs/heads/main
